<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixelgruppe</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui}main{max-width:850px;margin:auto;padding:18px}.box{background:#1b1b1b;padding:18px;border-radius:14px;margin:14px 0}input,button{padding:10px;border-radius:8px;background:#222;color:#eee;border:1px solid #444}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:1px solid #777}#wrap{width:min(90vw,700px);aspect-ratio:1;margin:15px auto}canvas{width:100%;height:100%;image-rendering:pixelated;background:white;cursor:crosshair}.err{color:#ff7777}.ok{color:#7f9}.user{display:inline-block;background:#292929;padding:7px 10px;border-radius:20px;margin:3px}
</style></head><body><main>
<div id="login" class="box"><h1>🎨 Unsere Pixelgruppe</h1><p>200 × 200 Pixel · 30 Teilnehmer</p><div class="row"><input id="ln" placeholder="Benutzername"><input id="lp" type="password" placeholder="Passwort"><button onclick="login()">Anmelden</button></div><p id="lm"></p></div>
<div id="app" class="hide"><div class="box"><div class="row"><h1 style="flex:1">🎨 Pixelbild</h1><span>Du: <b id="me"></b> <i id="my" class="dot"></i></span><button onclick="location.reload()">Abmelden</button></div><p id="cd" class="ok">Bereit – klicke auf einen Pixel.</p><div id="wrap"><canvas id="cv" width="200" height="200"></canvas></div><small>Ein Pixel alle 5 Sekunden. Die Sperre wird auf dem Server geprüft.</small></div>
<div class="box"><h3>Teilnehmer</h3><div id="list"></div></div>
<div class="box"><h3>👑 Admin</h3><div class="row"><input id="ap" type="password" placeholder="Admin-Passwort"><button onclick="showAdd()">Teilnehmer hinzufügen</button><button onclick="resetBoard()">Bild zurücksetzen</button></div><div id="add" class="hide" style="margin-top:12px"><div class="row"><input id="nn" placeholder="Name"><input id="np" type="password" placeholder="Passwort"><input id="nc" type="color" value="#ff0000"><button onclick="create()">Anlegen</button></div></div><p id="am"></p><div id="adminlist"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
let me=JSON.parse(localStorage.getItem("pg")||"null"),timer;const c=document.getElementById("cv"),x=c.getContext("2d");
function draw(){x.fillStyle="#fff";x.fillRect(0,0,200,200)}draw();
async function state(){let s=await(await fetch("/api/state")).json();draw();s.pixels.forEach(p=>{x.fillStyle=p.color;x.fillRect(p.x,p.y,1,1)})}
async function users(){let u=await(await fetch("/api/users")).json();list.innerHTML=u.map(a=>`<span class=user><i class=dot style="background:${a.color}"></i> ${a.username}</span>`).join("");adminlist.innerHTML=u.map(a=>`<div style="margin:6px"><i class=dot style="background:${a.color}"></i> ${a.username} <button onclick="del(${a.id})">Löschen</button></div>`).join("")}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:ln.value,password:lp.value})}),d=await r.json();if(!r.ok){lm.className="err";lm.textContent=d.error;return}me=d;localStorage.setItem("pg",JSON.stringify(me));startApp()}
function startApp(){loginBox();meEl();state();users()}function loginBox(){login.classList.add("hide");app.classList.remove("hide")}function meEl(){me=document.getElementById("me").textContent=me.username;document.getElementById("my").style.background=JSON.parse(localStorage.getItem("pg")).color}
c.onclick=async e=>{let r=c.getBoundingClientRect(),px=Math.floor((e.clientX-r.left)/r.width*200),py=Math.floor((e.clientY-r.top)/r.height*200),u=JSON.parse(localStorage.getItem("pg"));let z=await fetch("/api/pixel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:u.id,x:px,y:py})}),d=await z.json();if(!z.ok){cd.className="err";cd.textContent=d.error;cool(d.remaining||0)}else cool(5000)};
function cool(ms){clearInterval(timer);let end=Date.now()+ms;timer=setInterval(()=>{let n=end-Date.now();if(n<=0){clearInterval(timer);cd.textContent="Bereit – klicke auf einen Pixel."}else cd.textContent="⏱️ Nächster Pixel in "+Math.ceil(n/1000)+" Sekunden…"},200)}
function showAdd(){add.classList.remove("hide")}async function create(){let r=await fetch("/api/admin/users",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":ap.value},body:JSON.stringify({username:nn.value,password:np.value,color:nc.value})}),d=await r.json();am.textContent=r.ok?"Teilnehmer angelegt.":d.error;if(r.ok){nn.value=np.value="";users()}}
async function del(id){if(!confirm("Teilnehmer löschen?"))return;let r=await fetch("/api/admin/users/"+id,{method:"DELETE",headers:{"x-admin-password":ap.value}}),d=await r.json();am.textContent=r.ok?"Teilnehmer gelöscht.":d.error;users()}
async function resetBoard(){if(!confirm("Alle Pixel löschen?"))return;let r=await fetch("/api/admin/reset",{method:"POST",headers:{"x-admin-password":ap.value}});am.textContent=r.ok?"Bild zurückgesetzt.":"Admin-Passwort falsch."}
const so=io();so.on("pixel",p=>{x.fillStyle=p.color;x.fillRect(p.x,p.y,1,1)});so.on("reset",state);so.on("reload",()=>{state();users()});if(me)startApp();
</script></main></body></html>
